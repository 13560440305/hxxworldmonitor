# World Monitor — self-hosted platform stack (Phase 0)
# Usage: docker compose -f deploy/docker-compose.yml up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: worldmonitor
      POSTGRES_PASSWORD: worldmonitor
      POSTGRES_DB: hxxworldmonitor
    ports:
      - "5432:5432"
    volumes:
      - wm_pg_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worldmonitor -d hxxworldmonitor"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - wm_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible OSS for local dev (production: Aliyun OSS / Tencent COS)
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: worldmonitor
      MINIO_ROOT_PASSWORD: worldmonitor123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - wm_minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 worldmonitor worldmonitor123;
      mc mb --ignore-existing local/wm-cold;
      exit 0;
      "

volumes:
  wm_pg_data:
  wm_redis_data:
  wm_minio_data:
